<!doctype html>
<title>Sign in</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 4rem auto; }
  label { display:block; margin:.75rem 0 .25rem; }
  input { width:100%; padding:.5rem; box-sizing:border-box; }
  button { margin-top:1rem; padding:.5rem 1rem; } .error { color:#b00020; }
  .hint { color:#666; font-size:.85rem; margin-top:2rem; }
</style>
<h1>Sign in</h1>
<p>Authenticate to approve the device.</p>
<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email</label><input name="email" type="email" autofocus required>
  <label>Password</label><input name="password" type="password" required>
  <button type="submit">Log in</button>
</form>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p class="hint">Demo user: user@example.com / correct-horse-battery-staple</p>
