<!doctype html>
<title>{% if ok %}Email verified{% else %}Link invalid{% endif %}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 5rem auto; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; }
  .ok { color: #0a7d33; }
  .bad { color: #b00020; }
  .hint { color: #666; font-size: 0.85rem; margin-top: 1.5rem; }
  a { color: #0057d8; }
</style>

<div class="box">
{% if ok %}
  <h1 class="ok">Email verified &#10003;</h1>
  <p>Your address is confirmed. You can now sign in.</p>
  <p><a href="{{ url_for('login') }}">Go to sign in</a></p>
{% else %}
  <h1 class="bad">This link isn't valid</h1>
  <p>
    It may have expired, already been used, or been mistyped. Verification
    links are single-use and short-lived on purpose.
  </p>
  <p><a href="{{ url_for('signup') }}">Sign up again</a> to get a fresh link.</p>
{% endif %}
</div>
