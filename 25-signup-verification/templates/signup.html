<!doctype html>
<title>Create account</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 4rem auto; }
  label { display: block; margin: 0.75rem 0 0.25rem; }
  input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; }
  .error { color: #b00020; margin-top: 1rem; }
  .hint { color: #666; font-size: 0.85rem; margin-top: 1.5rem; }
  a { color: #0057d8; }
</style>

<h1>Create your account</h1>

<form method="post" action="{{ url_for('signup') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" autofocus required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button type="submit">Sign up</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<p class="hint">
  Password: at least 12 characters, not a common/breached one.<br>
  We'll email you a link to confirm the address before the account works.
</p>

<p class="hint"><a href="{{ url_for('login') }}">&larr; Already have an account? Sign in</a></p>
